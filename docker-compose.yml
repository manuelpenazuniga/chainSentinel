# =============================================================================
# ChainSentinel — Docker Compose (dev / single-host deploy)
# =============================================================================
#
# One service: the AI agent. Frontend deploys to Vercel/Netlify (no need to
# containerise it). Smart contracts live on-chain.
#
# Usage:
#   # Build the image
#   docker compose build
#
#   # Run with .env in the project root supplying secrets
#   docker compose up -d
#
#   # Tail logs
#   docker compose logs -f agent
#
#   # Verify healthcheck + metrics
#   curl http://localhost:9090/health      # → 200 ok
#   curl http://localhost:9090/metrics     # → Prometheus text format
#
#   # Stop and clean up
#   docker compose down
# =============================================================================

services:
  agent:
    build:
      context: ./agent
      dockerfile: Dockerfile
    image: chainsentinel-agent:latest
    container_name: chainsentinel-agent
    restart: unless-stopped

    # Forward the metrics endpoint to the host so Prometheus / curl can reach it.
    ports:
      - "9090:9090"

    # All secrets and config come from the project root .env file.
    # Required:  RPC_URL, CHAIN_ID, AGENT_PRIVATE_KEY, VAULT_ADDRESS,
    #            REGISTRY_ADDRESS, GEMINI_API_KEY
    # Optional:  TELEGRAM_*, DISCORD_WEBHOOK_URL, SLACK_WEBHOOK_URL,
    #            PAGERDUTY_ROUTING_KEY, SENTRY_DSN, HEARTBEAT_ADDRESS,
    #            VAULT_ADDRESS_PVM, REGISTRY_ADDRESS_PVM,
    #            FETCH_CONCURRENCY, PERSISTENCE_FLUSH_BLOCKS, METRICS_PORT
    env_file:
      - .env

    # Persist the SQLite snapshot so restarts don't lose context.
    # Maps a host directory ./agent-data → /app/data inside the container.
    volumes:
      - ./agent-data:/app/data
    environment:
      PERSISTENCE_DB_PATH: /app/data/agent.db

    # Resource hints — generous defaults; tune per workload.
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M

    # The Dockerfile already declares HEALTHCHECK; compose inherits it.
    # Uncomment to override interval/retries here if needed.
    # healthcheck:
    #   test: ["CMD", "wget", "-q", "-O-", "http://localhost:9090/health"]
    #   interval: 30s
    #   timeout: 10s
    #   retries: 3
